<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ink" x1="240" y1="180" x2="790" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FF7FF"/>
      <stop offset=".48" stop-color="#38D7FF"/>
      <stop offset="1" stop-color="#8CFFD8"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10243E"/>
      <stop offset=".55" stop-color="#081524"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#2EC9FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2EC9FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.85  0 0 0 0 1  0 0 0 .55 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <!-- app tile -->
  <rect x="56" y="56" width="912" height="912" rx="224" fill="url(#plate)" filter="url(#shadow)"/>
  <rect x="56" y="56" width="912" height="912" rx="224" fill="none" stroke="#8BEFFF" stroke-opacity=".18" stroke-width="3"/>
  <rect x="56" y="56" width="912" height="912" rx="224" fill="url(#halo)"/>
  <circle cx="512" cy="512" r="350" fill="none" stroke="#4BE2FF" stroke-opacity=".18" stroke-width="3" stroke-dasharray="3 18"/>
  <!-- six seats -->
  <g fill="#8CFFD8" opacity=".9">
    <circle cx="512" cy="142" r="13"/>
    <circle cx="832" cy="315" r="11"/>
    <circle cx="845" cy="677" r="11"/>
    <circle cx="512" cy="834" r="9"/>
    <circle cx="178" cy="674" r="11"/>
    <circle cx="190" cy="311" r="11"/>
  </g>
  <!-- A monogram -->
  <g filter="url(#glow)">
    <path d="M300 780 L 512 218 L 724 780" fill="none" stroke="url(#ink)" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M382 594 L 642 594" fill="none" stroke="url(#ink)" stroke-width="78" stroke-linecap="round"/>
  </g>
  <circle cx="512" cy="218" r="18" fill="#C8FFF1" opacity=".95"/>
</svg>
