name: Release

# Builds Anbot releases from rml4791lol-lang/Anbot. The plugin tarball is attached
# to GitHub Releases without publishing to npm. Desktop and Android keep their own checks.
#
# The repository is private. GitHub Release assets and the releases API cannot be used as an
# anonymous update feed. This workflow stores no updater credential; installed apps report the
# private channel as a failed check unless a verifiable feed is supplied through
# ANBOT_UPDATE_URL (or the compatible DS_BOT_UPDATE_URL).
#
# The release tag must be v<version in app/package.json>, and app/package.json must match the
# bundled ds-bot plugin version. Publish with "Set as latest release" off. The final job marks it
# Latest only after the Windows, macOS, Linux and Android assets, notes, and SHA256SUMS.txt are attached.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and build the packages without attaching a release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_REPOSITORY: rml4791lol-lang/Anbot

jobs:
  checks:
    name: Repository and plugin checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - name: Require the Anbot repository
        if: github.repository != env.APP_REPOSITORY
        run: |
          echo "::error::This release workflow belongs to $APP_REPOSITORY, not $GITHUB_REPOSITORY."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the tag and versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          app="$(node -p "require('../app/package.json').version")"
          plugin="$(node -p "require('./package.json').version")"
          if [ "$app" != "$plugin" ]; then
            echo "::error::app/package.json has version $app, but ds-bot/package.json has $plugin. Give both the same version."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$TAG" != "v$app" ]; then
            echo "::error::The release tag is $TAG, but Anbot has version $app. Tag v$app or change the version."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = release ] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main. Release from main."
            exit 1
          fi

      # The plugin tests rebuild link.js from ../link and run its Relay Server.
      - name: Install the phone link's test packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm ci --no-fund --no-audit
      - run: npm run harness
      - run: npm test
      - run: node scripts/build-client.mjs --check
      - run: npm run lint

      - name: Pack the plugin without publishing to npm
        run: npm pack
      - name: Attach the plugin to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "ds-bot-$(node -p "require('./package.json').version").tgz" --clobber

  app-contract:
    name: App identity and release contract
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: npm test

  app-windows:
    name: Desktop app installer (Windows)
    needs: app-contract
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: node scripts/seed-electron-checksums.mjs
      - run: npm run dist
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Keep the installer for real-device checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Anbot-win-x64
          path: app/dist-pack/Anbot-*-win-x64.exe
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Attach the installer to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          installer="dist-pack/Anbot-$(node -p "require('./package.json').version")-win-x64.exe"
          gh release upload "$TAG" "$installer" "$installer.blockmap" dist-pack/latest.yml --clobber

  app-macos:
    name: Desktop app zip (macOS ${{ matrix.arch }})
    needs: app-contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-26-intel }
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: node scripts/seed-electron-checksums.mjs
      - run: npm run dist
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Keep the zip for real-device checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Anbot-mac-${{ matrix.arch }}
          path: app/dist-pack/Anbot-*-mac-${{ matrix.arch }}.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Attach the zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          zip="dist-pack/Anbot-$(node -p "require('./package.json').version")-mac-${{ matrix.arch }}.zip"
          gh release upload "$TAG" "$zip" --clobber

  app-linux:
    name: Desktop app packages (Linux x64)
    needs: app-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: node scripts/seed-electron-checksums.mjs
      - run: npm run dist
      - name: Check the packaged app
        # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces that Chromium's
        # sandbox needs; the release runner may lift that restriction (it is its own machine).
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a node scripts/check-packed.mjs
      - name: Check the files for the release
        run: |
          version="$(node -p "require('./package.json').version")"
          ls -l "dist-pack/Anbot-$version-linux-x86_64.AppImage" "dist-pack/Anbot-$version-linux-amd64.deb" dist-pack/latest-linux.yml
      - name: Keep the packages for real-device checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Anbot-linux-x64
          path: |
            app/dist-pack/Anbot-*-linux-x86_64.AppImage
            app/dist-pack/Anbot-*-linux-amd64.deb
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Attach the packages to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # The AppImage carries its block map inside the file, so there is no .blockmap to attach.
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release upload "$TAG" "dist-pack/Anbot-$version-linux-x86_64.AppImage" "dist-pack/Anbot-$version-linux-amd64.deb" dist-pack/latest-linux.yml --clobber

  # The phone app's APK, signed with the upload key in the ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets. Every later APK must carry
  # the same key, or Android refuses it as an update. A dry run without the secrets
  # signs with the debug key, and that APK is for checks only.
  app-android:
    name: Phone app (Android)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export DSBOT_ANDROID_KEYSTORE="$RUNNER_TEMP/upload.jks" DSBOT_ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" DSBOT_ANDROID_KEY_ALIAS="$KEY_ALIAS"
          elif [ "$GITHUB_EVENT_NAME" = release ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing, so the APK cannot be signed for release."
            exit 1
          else
            echo "::warning::No upload key: this dry run signs the APK with the debug key."
          fi
          (cd android && ./gradlew assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,armeabi-v7a)
          rm -f "$RUNNER_TEMP/upload.jks"
          version="$(node -p "require('../ds-bot/package.json').version")"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Anbot-$version-android.apk"
      - name: Check the signature
        run: |
          if unzip -l dist/Anbot-*-android.apk | grep -Eq 'lib/(x86|x86_64)/'; then
            echo "::error::Release APK contains x86 simulator binaries."
            exit 1
          fi
          # --min-sdk-version 21 makes apksigner verify the v1 JAR signature too, even though
          # the app's minSdkVersion is 24 (where Android prefers v2/v3).
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          zipalign="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          "$zipalign" -c -P 16 4 dist/Anbot-*-android.apk
          certs="$("$apksigner" verify --min-sdk-version 21 --verbose --print-certs dist/Anbot-*-android.apk)"
          echo "$certs" | grep -E '(^Verified using v[123] |certificate (DN|SHA-256 digest):)'
          for scheme in 'v1 scheme (JAR signing): true' 'v2 scheme (APK Signature Scheme v2): true' 'v3 scheme (APK Signature Scheme v3): true'; do
            if ! echo "$certs" | grep -Fq "Verified using $scheme"; then
              echo "::error::The APK is missing signature $scheme."
              exit 1
            fi
          done
          if [ "$GITHUB_EVENT_NAME" = release ] && echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi
      - name: Keep the APK for real-device checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Anbot-android
          path: mobile/dist/Anbot-*-android.apk
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Attach the APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/Anbot-*-android.apk --clobber

  downloads:
    name: Download table, checksums and Latest
    needs: [app-windows, app-macos, app-linux, app-android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download the packages from the release
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release download "$TAG" --dir "$RUNNER_TEMP/packages" --pattern "Anbot-$version-*"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
      - name: Download the packages of the dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          pattern: Anbot-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Write the download table and the checksums
        run: |
          version="$(node -p "require('./package.json').version")"
          notes=()
          if [ -f "$RUNNER_TEMP/notes.md" ]; then notes=("$RUNNER_TEMP/notes.md"); fi
          node scripts/release-notes.mjs "$version" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/attach" "${notes[@]}" > "$RUNNER_TEMP/body.md"
          ls -l "$RUNNER_TEMP/attach"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the checksums and the copies without a version
        if: github.event_name == 'release'
        run: gh release upload "$TAG" "$RUNNER_TEMP"/attach/* --clobber
      - name: Put the download table on top of the notes
        if: github.event_name == 'release'
        run: gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
      - name: Mark the release as Latest
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: gh release edit "$TAG" --latest
