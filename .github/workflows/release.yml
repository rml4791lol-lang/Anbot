name: Release

# Builds Anbot releases from rml4791lol-lang/Anbot. The plugin tarball is attached
# to GitHub Releases without publishing to npm. Desktop and Android keep their own checks.
#
# The repository is private. GitHub Release assets and the releases API cannot be used as an
# anonymous update feed. This workflow stores no updater credential; installed apps report the
# private channel as a failed check unless a verifiable feed is supplied through
# ANBOT_UPDATE_URL (or the compatible DS_BOT_UPDATE_URL).
#
# The release tag must be v<version in app/package.json>, and app/package.json must match the
# bundled ds-bot plugin version. Publish with "Set as latest release" off. The final job marks it
# Latest only after the Windows, macOS, Linux and Android assets, notes, and SHA256SUMS.txt are attached.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and build the packages without attaching a release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_REPOSITORY: rml4791lol-lang/Anbot

jobs:
  # Fast pre-flight gate (~5 s) so invalid tags or mismatched versions fail immediately
  # without blocking the platform build jobs behind npm tests.
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - name: Require the Anbot repository
        if: github.repository != env.APP_REPOSITORY
        run: |
          echo "::error::This release workflow belongs to $APP_REPOSITORY, not $GITHUB_REPOSITORY."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the tag and versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          app="$(node -p "require('../app/package.json').version")"
          plugin="$(node -p "require('./package.json').version")"
          if [ "$app" != "$plugin" ]; then
            echo "::error::app/package.json has version $app, but ds-bot/package.json has $plugin. Give both the same version."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$TAG" != "v$app" ]; then
            echo "::error::The release tag is $TAG, but Anbot has version $app. Tag v$app or change the version."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = release ] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main. Release from main."
            exit 1
          fi

  checks:
    name: Repository and plugin checks
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ds-bot/package-lock.json
            link/package-lock.json

      # The plugin tests rebuild link.js from ../link and run its Relay Server, which have their own packages.
      - name: Install the phone link's test packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm ci --no-fund --no-audit
      - name: Cache DSH test harness
        id: harness-cache
        uses: actions/cache@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: dsh-harness-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('ds-bot/dev/harness/package.json') }}
      - name: Install DSH test harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: npm run harness
      - run: npm test
      - run: node scripts/build-client.mjs --check
      - run: npm run lint

      - name: Pack the plugin without publishing to npm
        run: npm pack
      # The plugin package reaches the release in the downloads job, with the app packages:
      # nothing is attached before every build has succeeded.
      - name: Keep the plugin package for the release
        uses: actions/upload-artifact@v4
        with:
          name: Anbot-plugin
          path: ds-bot/ds-bot-*.tgz
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  app-contract:
    name: App identity and release contract
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-fund --no-audit
      - run: npm test

  app-windows:
    name: Desktop app installer (Windows)
    needs: app-contract
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Name the download cache
        id: downloads-key
        run: echo "key=electron-downloads-${{ runner.os }}-${{ runner.arch }}-$(node -p "const d = require('./package.json').devDependencies; 'electron-' + d.electron + '-builder-' + d['electron-builder']")-${{ hashFiles('app/electron-builder.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore Electron and the build tools
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ steps.downloads-key.outputs.key }}
      - run: npm ci --no-fund --no-audit
      - run: node scripts/seed-electron-checksums.mjs
      - name: Cache the locked runtime archives
        uses: actions/cache@v4
        with:
          path: app/build/runtime-cache
          key: runtime-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/primary-runtime.lock.json') }}
      - run: npm run dist
      - name: Save Electron and the build tools
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      # Upload as a workflow artifact so nothing lands on the public GitHub Release until
      # every platform build has succeeded (downloads attaches everything at once).
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anbot-win-x64
          path: |
            app/dist-pack/Anbot-*-win-x64.exe
            app/dist-pack/Anbot-*-win-x64.exe.blockmap
            app/dist-pack/latest.yml
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  app-macos:
    name: Desktop app zip (macOS ${{ matrix.arch }})
    needs: app-contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-26-intel }
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Name the download cache
        id: downloads-key
        run: echo "key=electron-downloads-${{ runner.os }}-${{ runner.arch }}-$(node -p "const d = require('./package.json').devDependencies; 'electron-' + d.electron + '-builder-' + d['electron-builder']")-${{ hashFiles('app/electron-builder.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore Electron and the build tools
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ steps.downloads-key.outputs.key }}
      - run: npm ci --no-fund --no-audit
      - run: node scripts/seed-electron-checksums.mjs
      - name: Cache the locked runtime archives
        uses: actions/cache@v4
        with:
          path: app/build/runtime-cache
          key: runtime-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/primary-runtime.lock.json') }}
      - run: npm run dist
        env:
          # Standard Deflate level 5 cuts macOS Intel zip time substantially with ~1% size difference.
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
      - name: Save Electron and the build tools
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anbot-mac-${{ matrix.arch }}
          path: app/dist-pack/Anbot-*-mac-${{ matrix.arch }}.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  app-linux:
    name: Desktop app packages (Linux x64)
    needs: app-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Name the download cache
        id: downloads-key
        run: echo "key=electron-downloads-${{ runner.os }}-${{ runner.arch }}-$(node -p "const d = require('./package.json').devDependencies; 'electron-' + d.electron + '-builder-' + d['electron-builder']")-${{ hashFiles('app/electron-builder.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore Electron and the build tools
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ steps.downloads-key.outputs.key }}
      - run: npm ci --no-fund --no-audit
      - run: node scripts/seed-electron-checksums.mjs
      - name: Cache the locked runtime archives
        uses: actions/cache@v4
        with:
          path: app/build/runtime-cache
          key: runtime-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/primary-runtime.lock.json') }}
      - run: npm run dist
      - name: Save Electron and the build tools
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Check the packaged app
        # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces that Chromium's
        # sandbox needs; the release runner may lift that restriction (it is its own machine).
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a node scripts/check-packed.mjs
      - name: Check the files for the release
        # Verify every Linux release asset exists before uploading the artifact.
        run: |
          version="$(node -p "require('./package.json').version")"
          ls -l "dist-pack/Anbot-$version-linux-x86_64.AppImage" "dist-pack/Anbot-$version-linux-amd64.deb" dist-pack/latest-linux.yml
      - name: Upload Linux packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anbot-linux-x64
          path: |
            app/dist-pack/Anbot-*-linux-x86_64.AppImage
            app/dist-pack/Anbot-*-linux-amd64.deb
            app/dist-pack/latest-linux.yml
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  # The phone app's APK, signed with the upload key in the ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets. Every later APK must carry
  # the same key, or Android refuses it as an update. A dry run without the secrets
  # signs with the debug key, and that APK is for checks only.
  app-android:
    name: Phone app (Android)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            link/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Tag builds cannot share newly written caches with later tags; only workflow_dispatch
          # on a branch writes the Gradle cache so release tags read it without bloating quota.
          cache-read-only: ${{ github.event_name == 'release' }}
      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export DSBOT_ANDROID_KEYSTORE="$RUNNER_TEMP/upload.jks" DSBOT_ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" DSBOT_ANDROID_KEY_ALIAS="$KEY_ALIAS"
          elif [ "$GITHUB_EVENT_NAME" = release ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing, so the APK cannot be signed for release."
            exit 1
          else
            echo "::warning::No upload key: this dry run signs the APK with the debug key."
          fi
          (cd android && ./gradlew assembleRelease --no-daemon --build-cache --console=plain -PreactNativeArchitectures=arm64-v8a,armeabi-v7a)
          rm -f "$RUNNER_TEMP/upload.jks"
          version="$(node -p "require('../ds-bot/package.json').version")"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Anbot-$version-android.apk"
      - name: Check the signature
        run: |
          if unzip -l dist/Anbot-*-android.apk | grep -Eq 'lib/(x86|x86_64)/'; then
            echo "::error::Release APK contains x86 simulator binaries."
            exit 1
          fi
          # --min-sdk-version 21 makes apksigner verify the v1 JAR signature too, even though
          # the app's minSdkVersion is 24 (where Android prefers v2/v3).
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          zipalign="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          badging="$("$aapt2" dump badging dist/Anbot-*-android.apk)"
          compile_sdk="$(printf '%s\n' "$badging" | sed -n "s/.*compileSdkVersion='\([0-9]*\)'.*/\1/p" | head -n1)"
          target_sdk="$(printf '%s\n' "$badging" | sed -n "s/.*targetSdkVersion:'\([0-9]*\)'.*/\1/p" | head -n1)"
          if [ -z "$compile_sdk" ] || [ -z "$target_sdk" ] || [ "$compile_sdk" -gt "$target_sdk" ]; then
            echo "::error::Invalid Android SDK levels in APK: compileSdkVersion=$compile_sdk targetSdkVersion=$target_sdk"
            exit 1
          fi
          if ! printf '%s\n' "$badging" | grep -q "android.permission.POST_NOTIFICATIONS"; then
            echo "::error::Release APK does not declare android.permission.POST_NOTIFICATIONS."
            exit 1
          fi
          "$zipalign" -c -P 16 4 dist/Anbot-*-android.apk
          certs="$("$apksigner" verify --min-sdk-version 21 --verbose --print-certs dist/Anbot-*-android.apk)"
          echo "$certs" | grep -E '(^Verified using v[123] |certificate (DN|SHA-256 digest):)'
          for scheme in 'v1 scheme (JAR signing): true' 'v2 scheme (APK Signature Scheme v2): true' 'v3 scheme (APK Signature Scheme v3): true'; do
            if ! echo "$certs" | grep -Fq "Verified using $scheme"; then
              echo "::error::The APK is missing signature $scheme."
              exit 1
            fi
          done
          if [ "$GITHUB_EVENT_NAME" = release ] && echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anbot-android
          path: mobile/dist/Anbot-*-android.apk
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  downloads:
    name: Download table, checksums and Latest
    needs: [checks, app-windows, app-macos, app-linux, app-android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download built package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Anbot-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Read current release notes
        if: github.event_name == 'release'
        run: gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
      - name: Write the download table and the checksums
        run: |
          version="$(node -p "require('./package.json').version")"
          notes=()
          if [ -f "$RUNNER_TEMP/notes.md" ]; then notes=("$RUNNER_TEMP/notes.md"); fi
          node scripts/release-notes.mjs "$version" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/attach" "${notes[@]}" > "$RUNNER_TEMP/body.md"
          ls -l "$RUNNER_TEMP/packages" "$RUNNER_TEMP/attach"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach the plugin, the packages, the checksums and the copies to the release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" "$RUNNER_TEMP"/packages/* "$RUNNER_TEMP"/attach/* --clobber
      - name: Put the download table on top of the notes
        if: github.event_name == 'release'
        run: gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
      # GitHub cannot make a pre-release Latest.
      - name: Mark the release as Latest
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: gh release edit "$TAG" --latest
